# Example for a dashboard deployed in namespace ci on core-ci.
# Match the ServiceAccount namespace to the Deployment before applying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-alert-dashboard
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-alert-dashboard-monitoring
  namespace: ci-monitoring
rules:
- apiGroups: [monitoring.coreos.com]
  resources: [prometheusrules]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-alert-dashboard-monitoring
  namespace: ci-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-alert-dashboard-monitoring
subjects:
- kind: ServiceAccount
  name: ops-alert-dashboard
  namespace: ci
